apiVersion: proofrun.dev/v1
kind: Workflow
metadata:
  id: p2ppsr.metanet-fyi-first-understanding
  name: Metanet.fyi first understanding
  version: 1.0.0
  description: Proves that a newcomer can explain overlays accurately and reach a useful role-based next step.
target: {type: web, url: https://metanet.fyi, environment: production}
uses: [generic.website-baseline@1.0.0]
matrix:
  maxCases: 4
  dimensions:
    agent: [openai-computer]
    profile: [customer.impatient-newcomer@1.0.0, customer.cautious-low-vision@1.0.0]
    device: [device.chromium-desktop@1.0.0, device.chromium-mobile@1.1.0]
    accessibility: [standard]
budget:
  maxCases: 4
  maxProviderCalls: 48
  maxInputTokens: 400000
  maxOutputTokens: 48000
  maxCostUsd: 1
  perCase: {maxProviderCalls: 12, maxInputTokens: 100000, maxOutputTokens: 12000, maxCostUsd: 0.25}
  onExceed: block
intelligence:
  mode: adaptive
  initialTier: economy
  escalationTier: balanced
  maxEscalations: 1
  escalateBelowConfidence: 0.65
  escalateOn: [low-confidence, stall, invalid-response]
  observation: {mode: adaptive, initialDetail: low, escalationDetail: high, maxContextCharacters: 14000, skipUnchangedScreenshots: true}
journeys:
  - id: understand-and-choose
    goal: Understand what an overlay does, what it does not guarantee, and choose a useful next action.
    start: /
    maxActions: 28
    maxSeconds: 360
    steps:
      - id: enter-guide
        instruction: Arrive without prior BSV protocol knowledge, explain what this publication offers, and enter the overlay field guide through the primary path.
        expected: The value, independent editorial role, featured subject, and next action are clear from the first viewport.
        evidence: [screenshot, trace]
      - id: explain-model
        instruction: Read enough of the guide to explain the distinct jobs of the blockchain, an overlay, and an application; then explain why proof alone is not a storage policy.
        expected: The explanation includes selective topic rules, independent retention, verifiable evidence, and the fact that a Merkle proof cannot recreate missing bytes.
        evidence: [screenshot, trace]
      - id: choose-role-path
        instruction: Pick the most relevant visible route for a publisher, builder, or source-seeking reader and verify that the destination gives a concrete next action.
        expected: A role-specific action is visible, works, and preserves conceptual continuity.
        evidence: [screenshot, trace]
assertions:
  - {id: target-health, type: oracle, severity: fail, oracle: target-reachable, statement: Metanet.fyi remains reachable.}
  - {id: automated-a11y, type: accessibility, severity: fail, oracle: axe, statement: The traversed pages have no automated WCAG A/AA violations.}
  - {id: navigation-budget, type: performance, severity: warn, oracle: performance-budget, statement: Navigation remains within the five-second performance budget.}
policy:
  unsafeContent: stop
  highImpactActions: deny
  allowedHosts: [metanet.fyi, github.com, docs.bsvblockchain.org, bananablocks.com]
  spendLimit: 0
  spendUnit: USD
  warnExitCode: 0
remediation: {mode: manual, allowed: true, proposalOnly: true, requiredApprovers: 1}
