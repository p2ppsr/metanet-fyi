apiVersion: proofrun.dev/v1
kind: Workflow
metadata:
  id: p2ppsr.metanet-fyi-recovery-readiness
  name: Metanet.fyi recovery readiness path
  version: 1.0.0
  description: Proves that an on-chain publisher can identify continuity gaps and leave with a practical remediation path.
target: {type: web, url: https://metanet.fyi/overlays/recovery, environment: production}
matrix:
  maxCases: 2
  dimensions:
    agent: [openai-computer]
    profile: [customer.metanet-curious-reader@1.0.0]
    device: [device.chromium-desktop@1.0.0, device.chromium-mobile@1.1.0]
    accessibility: [keyboard]
budget:
  maxCases: 2
  maxProviderCalls: 60
  maxInputTokens: 500000
  maxOutputTokens: 60000
  maxCostUsd: 0.5
  perCase: {maxProviderCalls: 30, maxInputTokens: 250000, maxOutputTokens: 30000, maxCostUsd: 0.25}
  onExceed: block
intelligence:
  mode: adaptive
  initialTier: economy
  escalationTier: balanced
  maxEscalations: 1
  escalateBelowConfidence: 0.65
  escalateOn: [low-confidence, stall, invalid-response]
  observation: {mode: adaptive, initialDetail: low, escalationDetail: high, maxContextCharacters: 14000, skipUnchangedScreenshots: true}
journeys:
  - id: assess-and-remediate
    goal: Assess whether an on-chain dataset could outlive its original application and identify the next corrective action.
    start: /overlays/recovery
    maxActions: 60
    maxSeconds: 420
    steps:
      - id: complete-assessment
        instruction: Use only the keyboard to activate the visible “Load a fragile 2/7 example” action, representing a dataset with an open format and mined transaction artifacts but only one custodian, no tested catch-up, and no portable export. Confirm the honest score and leave unmet items unchecked; that truthful incomplete score is the successful task outcome, not a product warning.
        expected: Every check is understandable and operable, the score changes visibly, and the result correctly avoids a resilience claim. Treat that honest low score as a pass because the interface handled the incomplete scenario correctly.
        evidence: [screenshot, trace]
      - id: find-remediation
        instruction: Identify the missing continuity mechanisms, use the visible continuity-packet route, and follow the nearby build-path route that would help a builder address the gaps.
        expected: Independent copies, proof-bearing artifacts, catch-up, lookup contracts, exports, and recovery rehearsal are discoverable; the build path is reachable.
        evidence: [screenshot, trace]
assertions:
  - {id: target-health, type: oracle, severity: fail, oracle: target-reachable, statement: The recovery field kit remains reachable.}
  - {id: automated-a11y, type: accessibility, severity: fail, oracle: axe, statement: The recovery and build pages have no automated WCAG A/AA violations.}
policy:
  unsafeContent: stop
  highImpactActions: deny
  allowedHosts: [metanet.fyi]
  spendLimit: 0
  spendUnit: USD
  warnExitCode: 0
remediation: {mode: manual, allowed: true, proposalOnly: true, requiredApprovers: 1}
